name: CI for Backend 

on:
    push:
        branches:
            - main
        paths:
            - 'backend/**'
    pull_request:
        paths:
            - 'backend/**'

jobs:
    test:
        name: Run Django Tests
        runs-on: ubuntu-latest

        env:
            POSTGRES_USER: ${{ vars.POSTGRES_USER_CI }}
            POSTGRES_DB: ${{ vars.POSTGRES_DB_CI }}
            POSTGRES_HOST: 'db'
            POSTGRES_PORT: 5432
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_CI }}
            SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Create .env for CI
          run: |
            cd backend
            echo "POSTGRES_USER=${{ env.POSTGRES_USER }}" > .env
            echo "POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ env.POSTGRES_DB }}" >> .env
            echo "POSTGRES_HOST=${{ env.POSTGRES_HOST }}" >> .env
            echo "POSTGRES_PORT=${{ env.POSTGRES_PORT }}" >> .env
            echo "SECRET_KEY=${{ env.SECRET_KEY }}" >> .env

        - name: Build and start containers
          run: docker compose -f backend/compose.yml up -d --build

        - name: Run Django tests
          run: docker compose -f backend/compose.yml exec -T api python manage.py test

        - name: Stop and remove containers
          if: always()
          run: docker compose -f backend/compose.yml down
