name: Deploy Backend to Koyeb (via Docker Hub)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ★★★ イメージ名をDocker Hub用に変更 ★★★
      - name: Set up Docker image tag
        id: docker-meta
        run: |
          # イメージ名を docker.io/あなたのユーザー名/アプリ名:コミットハッシュ の形式にする
          IMAGE_NAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}/team-4-app:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.docker-meta.outputs.image_name }} ./backend
          docker push ${{ steps.docker-meta.outputs.image_name }}
          
      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Deploy to Koyeb
        run: |
          export PATH=$HOME/.koyeb/bin:$PATH
          # 更新するイメージ名をDocker Hubのパスに修正
          koyeb service update eg-hackathon-team4/backend-api --docker ${{ steps.docker-meta.outputs.image_name }} --token $KOYEB_API_TOKEN
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}