name: Deploy Backend to Koyeb

on:
  push
    # branches:
    #   - '**'
    # paths:
    #   - 'backend/**'

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker image tag
        id: docker-meta
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.docker-meta.outputs.image_name }} ./backend
          docker push ${{ steps.docker-meta.outputs.image_name }}
          
      - name: Install Koyeb CLI
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Deploy to Koyeb by updating the service
        run: |
          export PATH=$HOME/.koyeb/bin:$PATH
          koyeb service update eg-hackathon-team4/backend-api --docker ${{ steps.docker-meta.outputs.image_name }} --token $KOYEB_API_TOKEN
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}